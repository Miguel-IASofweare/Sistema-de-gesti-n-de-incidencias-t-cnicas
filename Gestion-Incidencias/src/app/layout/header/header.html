<h1>{{ titulo }}</h1>
<h1>{{ usuario }}</h1>

<button (click)="cambiarTitulo()">
  Cambiar título
</button>

<button (click)="toggleSeccion()">
  Mostrar/Ocultar
</button>

@if (mostrarSeccion) {
  <h2>Listado de incidencias</h2>

  @for (incidencia of incidencias; track incidencia.id) {

    <div>

      <h3>{{ incidencia.title }}</h3>

      <p>
        {{ incidencia.description }}
      </p>

    </div>

  } @empty {

    <p>No hay incidencias registradas.</p>

  }
}
<button
  [disabled]="botonDeshabilitado">
  Guardar
</button>
